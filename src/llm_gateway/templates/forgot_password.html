{% extends "base.html" %} {% block title %}Recover Access - LLM Gateway{%
endblock %} {% set hide_header = true %} {% block content %}
<div
  class="fixed inset-0 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-rose-100/40 via-slate-50 to-white dark:from-rose-900/10 dark:via-slate-900 dark:to-slate-950 -z-10"
></div>

<div class="min-h-[85vh] flex flex-col justify-center items-center px-4">
  <!-- Brand Logo/Name -->
  <div class="mb-8 text-center animate-fade-in-down">
    <div class="inline-flex items-center justify-center w-24 h-24 rounded-3xl shadow-2xl mb-4 backdrop-blur-xl overflow-hidden p-1.5 bg-slate-900/60 border border-rose-500/30 shadow-rose-500/20"><img src="/static/img/logo.png" alt="Logo" class="w-full h-full object-cover rounded-2xl" /></div>
    <h1 class="text-4xl font-extrabold text-slate-900 dark:text-white tracking-tighter">
      RECOVERY <span class="text-rose-500 font-light">PROTOCOL</span>
    </h1>
    <p
      class="text-slate-500 text-sm mt-2 uppercase tracking-[0.3em] font-medium"
    >
      Credential Restoration
    </p>
  </div>

  <div
    class="bg-white/60 dark:bg-slate-900/40 backdrop-blur-2xl p-10 rounded-[2.5rem] border border-slate-200 dark:border-slate-800 shadow-[0_22px_70px_4px_rgba(0,0,0,0.56)] w-full max-w-md transition-all hover:border-slate-700/50"
  >
    <div class="mb-8">
      <h2 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">
        Access Restoration
      </h2>
      <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">
        Request a cryptographic reset token.
      </p>
    </div>

    <form id="forgotForm" class="space-y-6">
      <div class="space-y-2">
        <label
          for="forgot-email"
          class="block text-xs font-bold text-slate-500 uppercase tracking-widest ml-1"
          >Registered Email</label
        >
        <div class="relative group">
          <span
            class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-rose-500 transition-colors"
          >
            <i class="fas fa-envelope" aria-hidden="true"></i>
          </span>
          <input
            type="email"
            id="forgot-email"
            name="email"
            placeholder="operative@internal.io"
            class="w-full bg-slate-100/60 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700/50 rounded-2xl py-4 pl-12 pr-4 text-slate-900 dark:text-white focus:ring-2 focus:ring-rose-500/50 focus:border-rose-500 outline-none transition-all placeholder:text-slate-600"
            required
          />
        </div>
      </div>

      <button
        type="submit"
        id="submitBtn"
        class="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-4 rounded-2xl transition-all shadow-lg shadow-rose-600/20 active:scale-[0.98] flex items-center justify-center gap-3 overflow-hidden"
      >
        <span id="btnText">EXECUTE RECOVERY</span>
      </button>

      <div id="message" class="hidden" role="alert">
        <div
          id="msgContainer"
          class="rounded-xl p-3 flex items-center gap-3 text-xs font-bold border"
        >
          <i id="msgIcon" class="fas" aria-hidden="true"></i>
          <span id="msgContent"></span>
        </div>
      </div>

      <div class="pt-4 text-center">
        <p
          class="text-slate-500 text-[11px] font-bold uppercase tracking-wider"
        >
          Remembered password?
          <a
            href="/auth/login"
            class="text-rose-500 hover:text-rose-400 transition-colors ml-1"
            >Abort Recovery</a
          >
        </p>
      </div>
    </form>
  </div>
</div>

<style>
  @keyframes fade-in-down {
    from {
      opacity: 0;
      transform: translateY(-20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .animate-fade-in-down {
    animation: fade-in-down 0.8s ease-out;
  }
</style>

<script>
  document
    .getElementById("forgotForm")
    .addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");
      const msgEl = document.getElementById("message");
      const msgContainer = document.getElementById("msgContainer");
      const msgIcon = document.getElementById("msgIcon");
      const msgContent = document.getElementById("msgContent");

      submitBtn.disabled = true;
      btnText.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
      msgEl.classList.add("hidden");

      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      try {
        const response = await fetchWithCsrf("/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        if (response.ok) {
          msgContainer.className =
            "bg-rose-500/10 border-rose-500/20 text-rose-400 rounded-xl p-4 flex items-center gap-3 text-xs font-bold border";
          msgIcon.className = "fas fa-check-circle";
          msgContent.textContent =
            "PROTOCOL INITIATED. CHECK SERVER LOGS FOR TOKEN.";
          msgEl.classList.remove("hidden");
          btnText.innerHTML = '<i class="fas fa-check animate-ping"></i>';
        } else {
          throw new Error("RECOV FAULT");
        }
      } catch (error) {
        msgContainer.className =
          "bg-rose-500/10 border-rose-500/20 text-rose-400 rounded-xl p-3 flex items-center gap-3 text-xs font-bold border";
        msgIcon.className = "fas fa-exclamation-triangle";
        msgContent.textContent = "REQUEST FAILED";
        msgEl.classList.remove("hidden");
        btnText.innerHTML = "RETRY RECOVERY";
        submitBtn.disabled = false;
      }
    });
</script>
{% endblock %}
