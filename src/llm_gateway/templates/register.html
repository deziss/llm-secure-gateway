{% extends "base.html" %} {% block title %}Acquire Access - LLM Gateway{%
endblock %} {% set hide_header = true %} {% block content %}
<div
  class="fixed inset-0 bg-[radial-gradient(circle_at_bottom_left,_var(--tw-gradient-stops))] from-emerald-100/40 via-slate-50 to-white dark:from-emerald-900/20 dark:via-slate-900 dark:to-slate-950 -z-10"
></div>

<div class="min-h-[90vh] flex flex-col justify-center items-center px-4 py-12">
  <!-- Brand Logo/Name -->
  <div class="mb-8 text-center animate-fade-in-up">
    <div class="inline-flex items-center justify-center w-24 h-24 rounded-3xl shadow-2xl mb-4 backdrop-blur-xl overflow-hidden p-1.5 bg-slate-900/60 border border-emerald-500/30 shadow-emerald-500/20"><img src="/static/img/logo.png" alt="Logo" class="w-full h-full object-cover rounded-2xl" /></div>
    <h1 class="text-4xl font-extrabold text-slate-900 dark:text-white tracking-tighter">
      GATEWAY <span class="text-emerald-500 font-light">REGISTRY</span>
    </h1>
    <p
      class="text-slate-500 text-sm mt-2 uppercase tracking-[0.3em] font-medium"
    >
      New Operative Enrollment
    </p>
  </div>

  <div
    class="bg-white/60 dark:bg-slate-900/40 backdrop-blur-2xl p-10 rounded-[2.5rem] border border-slate-200 dark:border-slate-800 shadow-[0_22px_70px_4px_rgba(0,0,0,0.56)] w-full max-w-md transition-all hover:border-slate-700/50"
  >
    <div class="mb-8">
      <h2 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">
        Identity Creation
      </h2>
      <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">
        Submit credentials for authorization.
      </p>
    </div>

    <form id="registerForm" class="space-y-5">
      <div class="space-y-2">
        <label
          for="register-email"
          class="block text-xs font-bold text-slate-500 uppercase tracking-widest ml-1"
          >Work Email</label
        >
        <div class="relative group">
          <span
            class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-emerald-500 transition-colors"
          >
            <i class="fas fa-envelope" aria-hidden="true"></i>
          </span>
          <input
            type="email"
            id="register-email"
            name="email"
            placeholder="operative@internal.io"
            class="w-full bg-slate-100/60 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700/50 rounded-2xl py-3.5 pl-12 pr-4 text-slate-900 dark:text-white focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 outline-none transition-all placeholder:text-slate-600 text-sm"
            required
          />
        </div>
      </div>

      <div class="space-y-2">
        <label
          for="register-password"
          class="block text-xs font-bold text-slate-500 uppercase tracking-widest ml-1"
          >Secure Passphrase</label
        >
        <div class="relative group">
          <span
            class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-emerald-500 transition-colors"
          >
            <i class="fas fa-key" aria-hidden="true"></i>
          </span>
          <input
            type="password"
            id="register-password"
            name="password"
            placeholder="Minimum 8 characters"
            class="w-full bg-slate-100/60 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700/50 rounded-2xl py-3.5 pl-12 pr-4 text-slate-900 dark:text-white focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 outline-none transition-all placeholder:text-slate-600 text-sm"
            required
            minlength="8"
          />
        </div>
      </div>

      <div class="space-y-2">
        <label
          for="register-invite"
          class="block text-xs font-bold text-slate-500 uppercase tracking-widest ml-1"
          >Cryptographic Invite Code</label
        >
        <div class="relative group">
          <span
            class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-emerald-500 transition-colors"
          >
            <i class="fas fa-ticket-alt" aria-hidden="true"></i>
          </span>
          <input
            type="text"
            id="register-invite"
            name="invite_code"
            placeholder="Required if protocol enabled"
            class="w-full bg-slate-100/60 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700/50 rounded-2xl py-3.5 pl-12 pr-4 text-slate-900 dark:text-white focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 outline-none transition-all placeholder:text-slate-600 text-sm font-mono tracking-wider"
          />
        </div>
      </div>

      <div class="pt-2">
        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-2xl transition-all shadow-lg shadow-emerald-600/20 active:scale-[0.98] flex items-center justify-center gap-3 overflow-hidden"
        >
          <span id="btnText">REQUEST ENROLLMENT</span>
        </button>
      </div>

      <div id="message" class="hidden" role="alert">
        <div
          id="msgContainer"
          class="rounded-xl p-3 flex items-center gap-3 text-xs font-bold border"
        >
          <i id="msgIcon" class="fas" aria-hidden="true"></i>
          <span id="msgContent"></span>
        </div>
      </div>

      <div class="pt-4 text-center">
        <p
          class="text-slate-500 text-[11px] font-bold uppercase tracking-wider"
        >
          Already registered?
          <a
            href="/auth/login"
            class="text-emerald-500 hover:text-emerald-400 transition-colors ml-1"
            >Return to Login</a
          >
        </p>
      </div>
    </form>
  </div>
</div>

<style>
  @keyframes fade-in-up {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .animate-fade-in-up {
    animation: fade-in-up 0.8s ease-out;
  }
</style>

<script>
  document
    .getElementById("registerForm")
    .addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");
      const msgEl = document.getElementById("message");
      const msgContainer = document.getElementById("msgContainer");
      const msgIcon = document.getElementById("msgIcon");
      const msgContent = document.getElementById("msgContent");

      submitBtn.disabled = true;
      btnText.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
      msgEl.classList.add("hidden");

      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      try {
        const response = await fetchWithCsrf(BASE_URL + "/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
          credentials: "include",
        });

        if (response.ok) {
          msgContainer.className =
            "bg-emerald-500/10 border-emerald-500/20 text-emerald-400 rounded-xl p-3 flex items-center gap-3 text-xs font-bold border";
          msgIcon.className = "fas fa-check-circle";
          msgContent.textContent = "ENROLLMENT GRANTED. REDIRECTING...";
          msgEl.classList.remove("hidden");
          btnText.innerHTML = '<i class="fas fa-check animate-ping"></i>';
          setTimeout(() => (window.location.href = "/auth/login"), 2000);
        } else {
          const err = await response.json();
          throw new Error(err.detail || "PROTOCOL FAULT");
        }
      } catch (error) {
        msgContainer.className =
          "bg-rose-500/10 border-rose-500/20 text-rose-400 rounded-xl p-3 flex items-center gap-3 text-xs font-bold border";
        msgIcon.className = "fas fa-exclamation-triangle";
        msgContent.textContent = error.message.toUpperCase();
        msgEl.classList.remove("hidden");
        btnText.innerHTML = "RETRY ENROLLMENT";
        submitBtn.disabled = false;
      }
    });
</script>
{% endblock %}
