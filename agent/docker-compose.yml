# One agent per GPU host. Set GPU_AGENT_TOKEN to the same value as the gateway's.
#   GPU_AGENT_TOKEN=... docker compose up -d      # pulls the image from GHCR
# To build locally instead (needs this directory): docker build -t ghcr.io/deziss/llm-secure-gateway-gpu-agent:latest .
services:
  llm-gpu-agent:
    image: ghcr.io/deziss/llm-secure-gateway-gpu-agent:${AGENT_TAG:-latest}
    restart: unless-stopped
    # Required so the agent can read the process list of GPU workloads (cmdline, parent pids).
    pid: host
    environment:
      GPU_AGENT_TOKEN: ${GPU_AGENT_TOKEN:?set GPU_AGENT_TOKEN}
      GPU_AGENT_PORT: "9835"
    ports:
      - "9835:9835"
    # NVIDIA: expose all GPUs through the nvidia container runtime.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # AMD (ROCm): use these instead of the deploy block above, and install amdsmi in the image
    # or let the agent fall back to rocm-smi.
    # devices:
    #   - /dev/kfd
    #   - /dev/dri
    # group_add:
    #   - video
