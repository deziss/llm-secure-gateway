[project]
name = "llm-gateway"
version = "0.9.0"
description = "A Secure LLM Gateway wrapper for Ollama/vLLM with API Keys and SPIFFE identity support."
authors = [
    {name = "Anshu Kushawaha", email = "anshu.kushwaha@nuvo.ai"},
]
dependencies = [
    # Core framework
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # System metrics
    "psutil>=5.9.0",

    # Cache
    "redis>=8.1.0",

    # Security
    "cryptography>=44.0.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.20",
    "bcrypt>=4.0.1",

    # Database
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.14.0",

    # Instrumentation
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-asyncio",

    # Phoenix OTEL wrapper
    "arize-phoenix-otel",
    "arize-phoenix-evals",
    "openinference-instrumentation",

    # Auth & System utilities
    "fastapi-users[sqlalchemy]>=14.0.0",
    "typer>=0.12.0",
    "jinja2>=3.1.0",
    "aiosmtplib>=3.0.0",
]
requires-python = ">=3.14"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "respx>=0.22.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
