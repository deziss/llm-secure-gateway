events {
    worker_connections 1024;
}

http {
    upstream gateway {
        # Round-robin across gateway instances
        server gateway-1:8000;
        server gateway-2:8000;
    }

    server {
        listen 80;

        # Proxy buffering off for streaming LLM responses
        proxy_buffering off;

        # Generous timeouts for long-running LLM requests
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        location / {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE / streaming support
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding on;
        }

        # Health check for the load balancer itself
        location /nginx-health {
            access_log off;
            return 200 "ok";
        }
    }
}
