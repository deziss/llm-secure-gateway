# Nginx load balancer for the LLM Secure Gateway (docker-compose.prod.yml).
# Tuned for long-lived, streaming LLM responses rather than short static hits.

# One worker per CPU core (default is 1, which caps you at a single core).
worker_processes auto;
# Each connection costs two fds upstream + downstream; keep this above
# worker_connections * 2.
worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    upstream gateway {
        # least_conn, not round-robin: LLM requests last seconds to minutes, so
        # round-robin hands a new request to a backend that is already serving
        # ten concurrent 5-minute streams.
        least_conn;

        # Passive health checks (nginx OSS has no active ones): evict a backend
        # for 15s after 3 failures, so a crashed/restarting instance stops
        # receiving traffic within ~one interval instead of getting every request.
        server gateway-1:8000 max_fails=3 fail_timeout=15s;
        server gateway-2:8000 max_fails=3 fail_timeout=15s;

        # Reuse upstream connections; requires proxy_http_version 1.1 and a
        # cleared Connection header in the location block below.
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    server {
        listen 80 backlog=4096;
        server_name _;

        # Proxy buffering off for streaming LLM responses (also keeps memory
        # flat: nothing is buffered to disk per in-flight request).
        proxy_buffering off;
        proxy_request_buffering off;

        # Generous timeouts for long-running LLM requests
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        # If a backend dies mid-request, retry the other one rather than
        # failing the client. Safe here because a retried request is one whose
        # response has not started streaming yet.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 30s;

        location / {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE / streaming support
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding on;
        }

        # Health check for the load balancer itself
        location /nginx-health {
            access_log off;
            return 200 "ok";
        }
    }
}
