name: 🐛 Bug Report
description: Report an issue or unexpected behavior in LLM Secure Gateway
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us diagnose and fix the problem quickly.
  - type: input
    id: version
    attributes:
      label: Gateway Version
      description: What version or commit of LLM Secure Gateway are you running? (Check `/api/version`)
      placeholder: "e.g., 0.10.0"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Affected Upstream Backend
      options:
        - Ollama
        - vLLM
        - llama.cpp
        - OpenAI
        - Anthropic Claude
        - Google Gemini
        - Groq
        - Other / Custom
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue.
      placeholder: |
        1. Start gateway with ...
        2. Send request to /v1/chat/completions ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Stack Traces
      description: Please copy any relevant gateway container logs or error payloads.
      render: shell
