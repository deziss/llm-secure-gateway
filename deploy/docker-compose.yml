# Pull-and-run deployment from GHCR (no source checkout needed).
#   cp .env.example .env   # fill in the secrets
#   docker compose pull && docker compose up -d
# Pin a release with GATEWAY_TAG=0.14.0 (default: latest).
services:
  migrate:
    image: ghcr.io/deziss/llm-secure-gateway:${GATEWAY_TAG:-latest}
    command: ["python", "scripts/migrate.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/gateway_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gateway:
    image: ghcr.io/deziss/llm-secure-gateway:${GATEWAY_TAG:-latest}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD}@postgres:5432/gateway_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${GATEWAY_PORT:-6130}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gateway_db
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
