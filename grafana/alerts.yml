# Prometheus alert rules for the LLM Gateway (v0.14.0).
# Every expression uses only metrics the gateway (/metrics) and the GPU agents emit.
# Thresholds are starting points: tune them per deployment.
# Job names must match prometheus/prometheus.yml (llm-gateway, gpu-agents).

groups:
  - name: llm-gateway
    rules:
      # Gateway target not scrapeable (process down, network, or bad metrics token)
      - alert: GatewayDown
        expr: up{job="llm-gateway"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "LLM Gateway /metrics is not reachable"
          runbook: "Check the container, the port mapping and the Prometheus bearer token"

      # More than 5% of requests failing
      - alert: HighErrorRate
        expr: >
          sum(rate(llm_gateway_requests_failed_total[5m]))
          / sum(rate(llm_gateway_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "LLM Gateway failure rate above 5%"
          runbook: "Check model server health and recent deployments (see the Observability page, Models tab)"

      # Requests queued behind one model for a long time
      - alert: ModelQueueBacklog
        expr: sum by (server, model) (llm_gateway_model_requests{state="waiting"}) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 10 requests waiting for {{ $labels.server }} / {{ $labels.model }}"
          runbook: "Add capacity, or check whether the server is saturated (KV cache, running count)"

      # Time to first token too slow
      - alert: HighTimeToFirstToken
        expr: >
          histogram_quantile(0.95,
            sum by (le, server, model) (rate(llm_gateway_time_to_first_token_seconds_bucket[5m]))
          ) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "TTFT p95 above 5s for {{ $labels.server }} / {{ $labels.model }}"
          runbook: "Long prompts, prefill saturation or a cold model load; check the server queue"

      # Upstream model server unreachable (llm_server_up is emitted by the poller)
      - alert: ModelServerDown
        expr: llm_server_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Model server {{ $labels.server }} is unreachable"
          runbook: "Check the Model servers page and the server's own logs"

      # KV cache nearly full on the upstream server
      - alert: KvCacheSaturated
        expr: llm_server_kv_cache_usage_ratio > 0.95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "KV cache above 95% on {{ $labels.server }}"
          runbook: "Lower max context or concurrency, or add a replica"

      # Gateway resident memory high (adjust the 4 GiB threshold to your host)
      - alert: GatewayMemoryHigh
        expr: llm_gateway_process_memory_bytes{type="rss"} > 4 * 1024 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LLM Gateway RSS above 4 GiB on {{ $labels.instance }}"
          runbook: "Check in-flight buffers per model; enable tracemalloc briefly from the Observability page if it keeps growing"

  - name: llm-gpu
    rules:
      # GPU agent / exporter not scrapeable
      - alert: GpuAgentDown
        expr: up{job="gpu-agents"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU metrics endpoint {{ $labels.instance }} is down"
          runbook: "Check the GPU agent container or service (needs --pid=host and GPU device access)"

      # VRAM nearly full (value and percent both appear in the summary)
      - alert: GpuVramNearlyFull
        expr: llm_gpu_memory_used_bytes / llm_gpu_memory_total_bytes > 0.95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "VRAM above 95% on {{ $labels.host }} GPU{{ $labels.gpu }}"
          runbook: "Reduce loaded models or context length on that GPU"

      # Thermal
      - alert: GpuTooHot
        expr: llm_gpu_temperature_celsius > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU temperature above 85 C on {{ $labels.host }} GPU{{ $labels.gpu }}"
          runbook: "Check cooling and power limits"
