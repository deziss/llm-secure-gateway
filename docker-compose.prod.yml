# Production-ready Docker Compose with HA gateway, load balancer, and optional
# Redis + PgBouncer.  All optional services are defined with profiles — they
# only start when you explicitly enable them:
#
#   docker compose -f docker-compose.prod.yml up -d                  # core only
#   docker compose -f docker-compose.prod.yml --profile redis up -d  # + Redis
#   docker compose -f docker-compose.prod.yml --profile cache --profile pgbouncer up -d  # all

services:

  # ==========================================================================
  # Nginx load balancer — single entry point on port 6130
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: llm-gateway-lb
    ports:
    - "6130:80"
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
    - gateway-1
    - gateway-2
    restart: unless-stopped

  # ==========================================================================
  # Gateway instances (2 for zero-downtime deploys / HA)
  # ==========================================================================
  gateway-1:
    build: .
    container_name: llm-gateway-1
    environment: &gw-env
    - PHOENIX_COLLECTOR_ENDPOINT=${PHOENIX_COLLECTOR_ENDPOINT:-http://host.docker.internal:6006}
    - PHOENIX_API_KEY=${PHOENIX_API_KEY:-}
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - UVICORN_LOOP=asyncio
    - DATABASE_URL=postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-password}@postgres:5432/gateway_db
    - PGBOUNCER_URL=${PGBOUNCER_URL:-}
    - REDIS_URL=${REDIS_URL:-}
    - AUTH_SECRET=${AUTH_SECRET}
    - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    - BASE_URL=${BASE_URL:-}
    - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@example.com}
    - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123}
    - SMTP_HOST=${SMTP_HOST:-localhost}
    - SMTP_PORT=${SMTP_PORT:-587}
    - SMTP_USER=${SMTP_USER:-}
    - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL:-admin@llmgateway.io}
    - ADMIN_EMAIL=${ADMIN_EMAIL:-superadmin@example.com}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
    - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  gateway-2:
    build: .
    container_name: llm-gateway-2
    environment: *gw-env
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
    - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ==========================================================================
  # PostgreSQL
  # ==========================================================================
  postgres:
    image: postgres:18-alpine
    container_name: llm-gateway-postgres
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: gateway_db
    volumes:
    - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Optional: Redis (enable with --profile redis)
  # Set REDIS_URL=redis://redis:6379/0 in .env to activate
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: llm-gateway-redis
    profiles: ["redis"]
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ==========================================================================
  # Optional: PgBouncer (enable with --profile pgbouncer)
  # Set PGBOUNCER_URL=postgresql+asyncpg://gateway:password@pgbouncer:6432/gateway_db in .env
  # ==========================================================================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: llm-gateway-pgbouncer
    profiles: ["pgbouncer"]
    environment:
      DATABASE_URL: 
        postgres://gateway:${POSTGRES_PASSWORD:-password}@postgres:5432/gateway_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  postgres18_data:
networks:
  default:
    name: llm_secure_gateway_prod_default_net
