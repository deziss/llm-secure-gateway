# Production-ready Docker Compose with HA gateway, load balancer, and optional
# Redis + PgBouncer.  All optional services are defined with profiles — they
# only start when you explicitly enable them:
#
#   docker compose -f docker-compose.prod.yml up -d                  # core only
#   docker compose -f docker-compose.prod.yml --profile redis up -d  # + Redis
#   docker compose -f docker-compose.prod.yml --profile cache --profile pgbouncer up -d  # all
#
# Zero-downtime rolling deploy of a new image (nginx only sends traffic to
# containers whose /health passes, so each instance is verified before it
# receives requests and the other one keeps serving meanwhile):
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --no-deps --wait --wait-timeout 180 gateway-1
#   docker compose -f docker-compose.prod.yml up -d --no-deps --wait --wait-timeout 180 gateway-2
#
# `--wait` only gates on healthchecks, which every long-running service below
# therefore defines.
#
# When switching this same checkout from the development Compose stack to this
# production stack, first run `docker compose down` (without `-v`) to release
# the shared fixed container names and development network. Named DB volumes
# are preserved.

services:

  # ==========================================================================
  # Nginx load balancer — single entry point on port 6130
  # ==========================================================================
  nginx:
    image: nginx:1.29-alpine
    container_name: llm-gateway-lb
    ports:
    - "6130:80"
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # Wait for both upstreams to report healthy, otherwise nginx starts, gets
    # "connection refused" from the backends and 502s the first requests.
    depends_on:
      gateway-1:
        condition: service_healthy
      gateway-2:
        condition: service_healthy
    # nginx:alpine ships wget; /nginx-health is served by nginx itself, so this
    # proves the config parsed and the listener is up.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ==========================================================================
  # Gateway instances (2 for zero-downtime deploys / HA)
  # ==========================================================================
  gateway-1:
    # Tagged so a rolling deploy can swap one replica at a time (`pull` then
    # `up -d --no-deps gateway-1`), and so local builds get a stable name.
    image: llm-secure-gateway:${GATEWAY_TAG:-local}
    build:
      context: .
      target: runtime
    container_name: llm-gateway-1
    env_file:
    - path: .env
      required: false
    environment: &gw-env
    - ENABLE_TELEMETRY=${ENABLE_TELEMETRY:-false}
    - PHOENIX_COLLECTOR_ENDPOINT=${PHOENIX_COLLECTOR_ENDPOINT:-http://host.docker.internal:6006}
    - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    - PHOENIX_API_KEY=${PHOENIX_API_KEY:-}
    # Observability v0.14.0 (docs/OBSERVABILITY.md). Per-tool keys for
    # OBS_EXPORTERS presets (LANGFUSE_*, ZO_*, SIGNOZ_*, ...) come from .env via env_file.
    - OBS_EXPORTERS=${OBS_EXPORTERS:-}
    - OBS_PROMETHEUS=${OBS_PROMETHEUS:-true}
    - OBS_METRICS_TOKEN=${OBS_METRICS_TOKEN:-}
    - OBS_METRICS_ALLOW_ANONYMOUS=${OBS_METRICS_ALLOW_ANONYMOUS:-false}
    - OBS_POLL_INTERVAL=${OBS_POLL_INTERVAL:-5}
    - OBS_FORCE_STREAM_USAGE=${OBS_FORCE_STREAM_USAGE:-false}
    - OBS_TRACEMALLOC=${OBS_TRACEMALLOC:-false}
    - GPU_AGENT_TOKEN=${GPU_AGENT_TOKEN:-}
    - LOG_LEVEL=${LOG_LEVEL:-info}
    # Loop left unset on purpose: uvicorn's default "auto" selects uvloop
    # (installed via uvicorn[standard]). Setting UVICORN_LOOP here would now really
    # take effect, and UPGRADE.md's high-throughput path assumes uvloop.
    - DATABASE_URL=postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-password}@postgres:5432/gateway_db
    - PGBOUNCER_URL=${PGBOUNCER_URL:-}
    - REDIS_URL=${REDIS_URL:-}
    - AUTH_SECRET=${AUTH_SECRET}
    - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    - BASE_URL=${BASE_URL:-}
    - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@example.com}
    - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123}
    - SMTP_HOST=${SMTP_HOST:-localhost}
    - SMTP_PORT=${SMTP_PORT:-587}
    - SMTP_USER=${SMTP_USER:-}
    - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL:-admin@llmgateway.io}
    - ADMIN_EMAIL=${ADMIN_EMAIL:-superadmin@example.com}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
    - "host.docker.internal:host-gateway"
    # The runtime image is Debian slim: no curl/wget. Probe /health (which runs
    # `SELECT 1`, so it also proves DB connectivity) with the stdlib.
    healthcheck: &gw-health
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Give in-flight requests (LLM streams can be long) time to finish; nginx
    # has already marked the instance unhealthy via max_fails before this.
    stop_grace_period: 120s
    restart: unless-stopped

  gateway-2:
    image: llm-secure-gateway:${GATEWAY_TAG:-local}
    build:
      context: .
      target: runtime
    container_name: llm-gateway-2
    env_file:
    - path: .env
      required: false
    environment: *gw-env
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
    - "host.docker.internal:host-gateway"
    # The runtime image is Debian slim: no curl/wget. Probe /health (which runs
    # `SELECT 1`, so it also proves DB connectivity) with the stdlib.
    healthcheck: *gw-health
    stop_grace_period: 120s
    restart: unless-stopped

  # ==========================================================================
  # PostgreSQL
  # ==========================================================================
  postgres:
    image: postgres:18-alpine
    container_name: llm-gateway-postgres
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: gateway_db
    volumes:
    - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Optional: Redis (enable with --profile redis)
  # Set REDIS_URL=redis://redis:6379/0 in .env to activate
  # ==========================================================================
  redis:
    image: redis:8.12.0-alpine
    container_name: llm-gateway-redis
    profiles: ["redis"]
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ==========================================================================
  # Optional: PgBouncer (enable with --profile pgbouncer)
  # Set PGBOUNCER_URL=postgresql+asyncpg://gateway:password@pgbouncer:6432/gateway_db in .env
  # ==========================================================================
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    container_name: llm-gateway-pgbouncer
    profiles: ["pgbouncer"]
    environment:
      DATABASE_URL: postgres://gateway:${POSTGRES_PASSWORD:-password}@postgres:5432/gateway_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres18_data:
networks:
  default:
    name: llm_secure_gateway_prod_default_net
